<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020802" />
  <meta name="description" content="10SONGS4U — a corrupted archive." />
  <title>ARCHIVE</title>
  <style>
    :root {
      --green: #4cff65;
      --green-strong: #60ff79;
      --green-dim: #238b35;
      --screen: #020802;
      --panel: #031005;
      --mono: "Courier New", Courier, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--screen); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--green);
      background:
        radial-gradient(ellipse at 50% 42%, #071b0a 0%, #020802 57%, #000400 100%);
      font-family: var(--mono);
      -webkit-font-smoothing: none;
      overflow-x: hidden;
    }

    /* CRT overlay is non-interactive: it cannot block file buttons. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .4;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, .34) 4px,
        rgba(0, 0, 0, .34) 5px
      );
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: .35;
      background: radial-gradient(ellipse at center, transparent 50%, #000 130%);
    }

    .archive {
      width: min(100% - 60px, 1730px);
      margin: 0 auto;
      padding: clamp(34px, 5vh, 54px) 0 32px;
    }

    .archive-head {
      text-align: center;
      text-shadow: 0 0 10px rgba(76, 255, 101, .38);
    }
    .archive-head h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 51px);
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: .025em;
    }
    .archive-head p {
      margin: 30px 0 0;
      font-size: clamp(20px, 2.45vw, 42px);
      line-height: 1.2;
      letter-spacing: .035em;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(20px, 3.4vw, 58px) clamp(18px, 4.1vw, 74px);
      margin-top: clamp(42px, 4.4vw, 72px);
    }
    .file-tile {
      appearance: none;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      aspect-ratio: 1.16;
      background: rgba(0, 9, 1, .5);
      border: 4px solid var(--green);
      border-radius: 11px;
      color: var(--green);
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 0 15px rgba(76, 255, 101, .04), 0 0 9px rgba(76, 255, 101, .10);
      transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .file-tile::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(76, 255, 101, .08);
      border-radius: 5px;
      pointer-events: none;
    }
    .file-tile:hover, .file-tile:focus-visible {
      background: rgba(23, 94, 34, .24);
      box-shadow: 0 0 20px rgba(76, 255, 101, .36), inset 0 0 20px rgba(76, 255, 101, .1);
      transform: translateY(-3px);
    }
    .file-tile:focus-visible { outline: 2px solid #e7ffe9; outline-offset: 5px; }
    .file-tile:active { transform: translateY(0); }
    .file-image {
      display: block;
      width: min(62%, 160px);
      height: auto;
      filter: drop-shadow(0 0 3px rgba(76, 255, 101, .35));
    }
    .file-number {
      font-size: 38px;
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: 2px;
    }
    .archive-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 32px;
      color: #329a46;
      font-size: clamp(10px, 1vw, 13px);
      letter-spacing: .12em;
    }
    .footer-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; }
    .footer-actions button, .footer-actions a {
      padding: 5px 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-actions button:hover, .footer-actions a:hover { color: var(--green); }
    .footer-actions button:focus-visible, .footer-actions a:focus-visible { outline: 1px solid var(--green); outline-offset: 3px; }

    .file-dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: min(85vh, 760px);
      overflow-y: auto;
      padding: 0;
      border: 2px solid var(--green);
      border-radius: 2px;
      background: #031005;
      color: var(--green);
      box-shadow: 0 0 50px rgba(76, 255, 101, .16), inset 0 0 30px rgba(76, 255, 101, .025);
      font-family: var(--mono);
    }
    .file-dialog::backdrop { background: rgba(0, 4, 0, .88); backdrop-filter: blur(3px); }
    .dialog-head {
      padding: 18px 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--green-dim);
    }
    .dialog-label { color: var(--green-dim); font-size: 12px; letter-spacing: .12em; }
    .dialog-head h2 {
      color: var(--green);
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 500;
      overflow-wrap: anywhere;
      margin: 8px 0 0;
    }
    .close-file {
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      color: var(--green);
      font-size: 27px;
      background: transparent;
      border: 1px solid var(--green-dim);
      cursor: pointer;
    }
    .close-file:hover { background: rgba(76, 255, 101, .15); }
    .dialog-body { padding: 24px 22px 30px; }
    .dialog-meta { font-size: 12px; color: #3ab44f; margin: 0 0 22px; }
    .file-content {
      white-space: pre-line;
      font-size: clamp(15px, 2.1vw, 17px);
      line-height: 1.8;
      margin: 0;
      min-height: 124px;
      text-shadow: 0 0 5px rgba(76, 255, 101, .22);
    }

    .ghost-player {
      margin: 18px 0 18px;
      padding: 17px 18px 16px;
      border: 1px solid var(--green-dim);
      background: rgba(76, 255, 101, .045);
      box-shadow: inset 0 0 18px rgba(76, 255, 101, .04);
    }
    .ghost-player[hidden], .ghost-after[hidden] { display: none; }
    .ghost-player-title {
      margin: 0 0 13px;
      font-size: 12px;
      letter-spacing: .1em;
      color: #80ff92;
    }
    .ghost-play {
      appearance: none;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--green);
      background: #05200b;
      color: var(--green);
      font: bold 14px var(--mono);
      letter-spacing: .08em;
      cursor: pointer;
      text-shadow: 0 0 7px rgba(76, 255, 101, .3);
    }
    .ghost-play:hover, .ghost-play:focus-visible {
      background: #0c3716;
      box-shadow: 0 0 12px rgba(76, 255, 101, .22);
    }
    .ghost-play:focus-visible, .ghost-seek:focus-visible {
      outline: 2px solid #d5ffda;
      outline-offset: 3px;
    }
    .ghost-play:disabled { opacity: .5; cursor: not-allowed; }
    .ghost-track {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: #8cf69b;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .ghost-seek {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 16px;
      cursor: pointer;
      accent-color: var(--green);
    }
    .ghost-audio-error { margin: 12px 0 0; font-size: 12px; color: #a6ffb1; }
    .ghost-audio-error:empty { display: none; }
    .file-content.is-ghost-intro { min-height: 0; }
    .ghost-after { min-height: 0; margin-top: 15px; }

    .code-form { margin-top: 26px; }
    .code-form label { display: block; font-size: 12px; letter-spacing: .1em; margin-bottom: 10px; }
    .code-controls { display: flex; flex-wrap: wrap; gap: 10px; }
    .code-controls input {
      flex: 1 1 190px;
      min-width: 0;
      padding: 13px 12px;
      background: #010601;
      color: var(--green);
      border: 1px solid var(--green);
      font: 18px var(--mono);
      letter-spacing: .12em;
      border-radius: 0;
    }
    .code-controls input::placeholder { color: #43864a; }
    .code-controls button {
      padding: 12px 20px;
      background: var(--green);
      border: 1px solid var(--green);
      color: #001a04;
      font: bold 14px var(--mono);
      cursor: pointer;
    }
    .code-controls button:hover { background: #a2ffaf; }
    .code-feedback { margin: 12px 0 0; min-height: 20px; font-size: 13px; color: #9affaa; }
    .dialog-bottom { border-top: 1px solid var(--green-dim); padding: 12px 22px; font-size: 11px; color: #298a3b; }

    @media (max-width: 1100px) {
      .file-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .archive { width: min(100% - 40px, 900px); }
    }
    @media (max-width: 630px) {
      .file-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
      .archive { width: calc(100% - 28px); padding-top: 34px; }
      .archive-head p { margin-top: 22px; }
      .file-tile { border-width: 3px; border-radius: 7px; }
      .file-number { font-size: 34px; }
      .archive-footer { flex-direction: column; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="archive">
    <header class="archive-head">
      <h1>10SONGS4U</h1>
      <p>10 FILES MISSING.</p>
    </header>

    <div class="file-grid" id="file-grid" aria-label="Recovered files">
    </div>
    <noscript><p>JavaScript is required to open the recovered files.</p></noscript>

    <footer class="archive-footer">
      <span id="system-status" role="status" aria-live="polite">SYSTEM ONLINE // ARCHIVE INCOMPLETE</span>
      <div class="footer-actions">
        <button type="button" id="reset-progress">RESET LOCAL PROGRESS</button>
        <a href="index.html">RETURN TO SITE</a>
      </div>
    </footer>
  </main>

  <dialog class="file-dialog" id="file-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <div>
        <div class="dialog-label" id="dialog-label">RECOVERED FILE</div>
        <h2 id="dialog-title">FILE</h2>
      </div>
      <button type="button" class="close-file" id="close-file" aria-label="Close file">×</button>
    </div>
    <div class="dialog-body">
      <p class="dialog-meta" id="dialog-meta"></p>
      <p class="file-content" id="file-content"></p>
      <div class="ghost-player" id="ghost-player" hidden>
        <p class="ghost-player-title">RECOVERED AUDIO // GHOSTING.INSTRUMENTAL</p>
        <button type="button" class="ghost-play" id="ghost-play" aria-label="Play GHOSTING instrumental">▶ PLAY INSTRUMENTAL</button>
        <div class="ghost-track">
          <span id="ghost-current">00:00</span>
          <input type="range" id="ghost-seek" class="ghost-seek" aria-label="GHOSTING playback position" value="0" min="0" max="100" step="1" disabled />
          <span id="ghost-total">04:17</span>
        </div>
        <p class="ghost-audio-error" id="ghost-audio-error" role="status" aria-live="polite"></p>
        <audio id="ghost-audio" src="assets/GHOSTING.mp3" preload="metadata"></audio>
      </div>
      <p class="file-content ghost-after" id="ghost-after" hidden></p>
      <form id="code-form" class="code-form" hidden>
        <label for="access-code">ENTER ACCESS CODE:</label>
        <div class="code-controls">
          <input id="access-code" type="text" name="access-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="________" maxlength="24" />
          <button type="submit">DECRYPT</button>
        </div>
        <p class="code-feedback" id="code-feedback" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="dialog-bottom" id="dialog-bottom">10SONGS4U // MEMORY FRAGMENT</div>
  </dialog>

  <script>
    "use strict";

    // ================================================================
    // THE STORY.
    // ================================================================
    const FILES = [
      {
        id: "01", title: "LOVE.TXT", type: "TEXT / RESTORED", access: "open",
        content: `RECOVERY COMPLETE.

10 files detected.
10 files recovered.
1 truth remains buried.

Some fragments have survived. Others are still encrypted.

The first transmission begins when LOVE.mp3 arrives.`
      },
      {
        id: "02", title: "MAKE ME LOVE FOR NOTHING?.TXT", type: "TEXT / RESTORED", access: "open",
        content: `MESSAGE STATUS: UNDELIVERED

There are different ways to cope.

Sometimes the line goes dead.
Sometimes someone chooses not to answer.

[SIGNAL LOST]`
      },
      {
        id: "03", title: "i_dontcare_what_i_miss_anymore__", type: "AUDIO / NOT YET ATTACHED", access: "open",
        content: `AUDIO STREAM UNAVAILABLE.

This archive contains no playable audio yet.`
      },
      {
        id: "04", title: "REPLACeABLE_MAP.TXT", type: "TEXT / PARTIAL", access: "open",
        content: `DECRYPTION NOTE:

[REDACTED]

[REDACTED].`
      },
      {
        id: "05", title: "THE__SOURCE.TXT", type: "TEXT / ENCRYPTED DEPENDENCY", access: "requiresCode",
        content: `THIS FILE REFERENCES AN ENCRYPTED FRAGMENT.

Decrypt FILE 06 to recover this message.`,
        unlockedContent: `DEPENDENCY RESOLVED.

THE SOURCE OF IT ALL. HE'S WAITING.

AWAIT RELEASE OF LOVE.MP3

[TRANSMISSION ENDS]`
      },
      {
        id: "06", title: "GHOST.TXT", type: "ENCRYPTED / CODE REQUIRED", access: "code",
        content: `ACCESS DENIED.

This fragment is intact, but encrypted.

Enter the recovered access code to read it.`,
        unlockedContent: `ACCESS GRANTED.

RECOVERED MESSAGE:

THE ABSENCE WAS DELIBERATE.

AWAIT RELEASE OF LOVE.MP3

[END OF FRAGMENT]`
      },
      { id: "07", title: "FRAGMENT_07.DAT", type: "DATA / CORRUPTED", access: "sealed" },
      { id: "08", title: "FRAGMENT_08.DAT", type: "DATA / CORRUPTED", access: "sealed" },
      { id: "09", title: "FRAGMENT_09.DAT", type: "DATA / CORRUPTED", access: "sealed" },
      { id: "10", title: "UNKNOWN_10.DAT", type: "DATA / CORRUPTED", access: "sealed" }
    ];

    const ACCESS_CODE = "GH0ST1NG";
    const SAVE_KEY = "10songs4u:ghosting06-decoded";
    const fileGrid = document.getElementById("file-grid");
    const dialog = document.getElementById("file-dialog");
    const fileContent = document.getElementById("file-content");
    const ghostPlayer = document.getElementById("ghost-player");
    const ghostAfter = document.getElementById("ghost-after");
    const ghostAudio = document.getElementById("ghost-audio");
    const ghostPlay = document.getElementById("ghost-play");
    const ghostSeek = document.getElementById("ghost-seek");
    const ghostCurrent = document.getElementById("ghost-current");
    const ghostTotal = document.getElementById("ghost-total");
    const ghostAudioError = document.getElementById("ghost-audio-error");
    const codeForm = document.getElementById("code-form");
    const codeInput = document.getElementById("access-code");
    const codeFeedback = document.getElementById("code-feedback");
    const statusText = document.getElementById("system-status");
    let activeFile = null;
    let unlocked = false;

    try { unlocked = localStorage.getItem(SAVE_KEY) === "true"; }
    catch (_) { /* Continue if localStorage is blocked. */ }

    // Inline SVG matches the rectangular, folded-corner file icon in the mockup.
    function fileIcon(number) {
      return `<svg class="file-image" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
        <path d="M18 8 H116 L149 41 V151 H18 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter"/>
        <text x="82" y="108" class="file-number" text-anchor="middle" fill="currentColor">${number}</text>
      </svg>`;
    }

    FILES.forEach(file => {
      const tile = document.createElement("button");
      tile.className = "file-tile";
      tile.type = "button";
      tile.setAttribute("aria-label", `Open file ${file.id}`);
      tile.innerHTML = fileIcon(file.id);
      tile.addEventListener("click", () => openFile(file));
      fileGrid.appendChild(tile);
    });

    function updateStatus() {
      statusText.textContent = unlocked
        ? "ACCESS KEY ACCEPTED // ARCHIVE INCOMPLETE"
        : "SYSTEM ONLINE // ARCHIVE INCOMPLETE";
    }

    // Place the new audio player immediately above the exact line requested.
    // It stays absent for locked files and every file other than 06.
    function showFileText(file) {
      ghostPlayer.hidden = true;
      ghostAfter.hidden = true;
      fileContent.classList.remove("is-ghost-intro");

      if (file.access === "sealed") {
        fileContent.textContent = `ERROR: FRAGMENT ${file.id} IS CORRUPTED.\n\nNO READABLE DATA CURRENTLY AVAILABLE.\n\nAWAIT NEXT TRANSMISSION.`;
      } else if (file.id === "06" && file.access === "code" && unlocked) {
        const marker = "THE ABSENCE WAS DELIBERATE.";
        const pos = file.unlockedContent.indexOf(marker);
        if (pos !== -1) {
          fileContent.textContent = file.unlockedContent.slice(0, pos).trimEnd();
          fileContent.classList.add("is-ghost-intro");
          ghostAfter.textContent = file.unlockedContent.slice(pos).trimStart();
          ghostAfter.hidden = false;
          ghostPlayer.hidden = false;
        } else {
          fileContent.textContent = file.unlockedContent;
        }
      } else if (file.access === "code") {
        fileContent.textContent = file.content;
      } else if (file.access === "requiresCode") {
        fileContent.textContent = unlocked ? file.unlockedContent : file.content;
      } else {
        fileContent.textContent = file.content;
      }
    }

    function openFile(file) {
      activeFile = file;
      document.getElementById("dialog-label").textContent = `RECOVERED FILE ${file.id} / 10`;
      document.getElementById("dialog-title").textContent = file.title;
      document.getElementById("dialog-meta").textContent = `STATUS: ${file.type}`;
      document.getElementById("dialog-bottom").textContent = `10SONGS4U // FRAGMENT ${file.id}`;
      codeForm.hidden = true;
      codeForm.reset();
      codeFeedback.textContent = "";

      showFileText(file);
      if (file.access === "code") codeForm.hidden = unlocked;

      dialog.showModal();
      if (file.access === "code" && !unlocked) codeInput.focus();
    }

    codeForm.addEventListener("submit", event => {
      event.preventDefault();
      if (!activeFile || activeFile.access !== "code") return;
      if (codeInput.value.trim().toUpperCase() === ACCESS_CODE) {
        unlocked = true;
        try { localStorage.setItem(SAVE_KEY, "true"); }
        catch (_) { /* Still works for this visit. */ }
        codeForm.hidden = true;
        showFileText(activeFile);
        updateStatus();
      } else {
        codeFeedback.textContent = "INVALID KEY. CHECK THE CHARACTERS AND TRY AGAIN.";
        codeInput.select();
      }
    });

    function timeStamp(seconds) {
      const value = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
      return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
    }
    function syncPlayButton() {
      const isPlaying = !ghostAudio.paused && !ghostAudio.ended;
      ghostPlay.textContent = isPlaying ? "Ⅱ PAUSE INSTRUMENTAL" : "▶ PLAY INSTRUMENTAL";
      ghostPlay.setAttribute("aria-label", isPlaying ? "Pause GHOSTING instrumental" : "Play GHOSTING instrumental");
    }
    ghostPlay.addEventListener("click", async () => {
      ghostAudioError.textContent = "";
      if (ghostAudio.paused || ghostAudio.ended) {
        try { await ghostAudio.play(); }
        catch (_) { ghostAudioError.textContent = "AUDIO COULD NOT BE PLAYED. CHECK THE FILE PATH."; }
      } else {
        ghostAudio.pause();
      }
    });
    ghostAudio.addEventListener("play", syncPlayButton);
    ghostAudio.addEventListener("pause", syncPlayButton);
    ghostAudio.addEventListener("ended", syncPlayButton);
    ghostAudio.addEventListener("loadedmetadata", () => {
      if (Number.isFinite(ghostAudio.duration)) {
        ghostSeek.max = Math.floor(ghostAudio.duration);
        ghostSeek.disabled = false;
        ghostTotal.textContent = timeStamp(Math.ceil(ghostAudio.duration));
      }
    });
    ghostAudio.addEventListener("timeupdate", () => {
      ghostCurrent.textContent = timeStamp(ghostAudio.currentTime);
      ghostSeek.value = Math.floor(ghostAudio.currentTime);
    });
    ghostAudio.addEventListener("error", () => {
      ghostAudioError.textContent = "AUDIO FILE NOT FOUND. CONFIRM assets/GHOSTING.mp3 IS UPLOADED.";
    });
    ghostSeek.addEventListener("input", () => {
      if (Number.isFinite(ghostAudio.duration)) ghostAudio.currentTime = Number(ghostSeek.value);
    });
    // Music must stop when leaving the recovered file.
    dialog.addEventListener("close", () => ghostAudio.pause());

    document.getElementById("close-file").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      // Close only when clicking outside the dialog's visible rectangle.
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
    document.getElementById("reset-progress").addEventListener("click", () => {
      if (!window.confirm("Reset your locally saved progress on this device?")) return;
      unlocked = false;
      try { localStorage.removeItem(SAVE_KEY); }
      catch (_) { /* No saved data to remove. */ }
      updateStatus();
      if (dialog.open && activeFile) {
        dialog.close();
        openFile(activeFile);
      }
    });
    updateStatus();
  </script>
</body>
</html>
